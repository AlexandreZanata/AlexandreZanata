name: Update stats cards

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download stats SVGs
        run: |
          mkdir -p assets
          curl -fsSL -o assets/github-stats.svg \
            "https://github-readme-stats-one-bice.vercel.app/api?username=AlexandreZanata&show_icons=true&theme=tokyonight&hide_border=true"
          curl -fsSL -o assets/top-langs.svg \
            "https://github-readme-stats-one-bice.vercel.app/api/top-langs/?username=AlexandreZanata&layout=compact&theme=tokyonight&hide_border=true&langs_count=8"
          curl -fsSL -o assets/activity-graph.svg \
            "https://github-readme-activity-graph.vercel.app/graph?username=AlexandreZanata&theme=tokyo-night&hide_border=true&area=true&custom_title=Contribution%20graph"
          head -c 20 assets/github-stats.svg | grep -q svg
          head -c 20 assets/top-langs.svg | grep -q svg

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --staged --quiet || git commit -m "chore: refresh profile stats cards"
          git push
