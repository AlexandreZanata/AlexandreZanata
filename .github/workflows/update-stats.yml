name: Update contribution graph

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download contribution graph
        run: |
          mkdir -p assets
          curl -fsSL -o assets/activity-graph.svg \
            "https://github-readme-activity-graph.vercel.app/graph?username=AlexandreZanata&theme=tokyo-night&hide_border=true&area=true&custom_title=Contribution%20graph"
          head -c 20 assets/activity-graph.svg | grep -q svg

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-graph.svg
          git diff --staged --quiet || git commit -m "chore: refresh contribution graph"
          git push
